name: Web and Android Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-web-and-pwa:
    name: Build Web & PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile App
        run: npm run build

      - name: Archive Production Build
        uses: actions/upload-artifact@v4
        with:
          name: qurioso-web-build
          path: dist/

  build-android-apk:
    name: Build Android APK
    needs: build-web-and-pwa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx --no-install cap add android
          fi
          npx --no-install cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qurioso-android-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-release:
    name: Publish release downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-web-and-pwa, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: qurioso-web-build
          path: release/web

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: qurioso-android-debug.apk
          path: release/android

      - name: Prepare release files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release/web
          zip -r "../qurioso-web-${RELEASE_TAG}.zip" .
          cd ../..
          cp release/android/app-debug.apk "release/qurioso-android-debug-${RELEASE_TAG}.apk"
          cat > release/notes.md <<'NOTES'
          ## Classroom activities
          Open https://napo.github.io/qurioso/?app=classroom to use Qurioso without installing anything.

          ## Downloads
          - **Web ZIP**: static website files. This archive does not include the multiplayer server.
          - **Android debug APK**: experimental, automatically debug-signed build for testing. It does not include the Node.js multiplayer server.

          Windows, macOS and Linux desktop installers are not available in this release. Network quizzes currently require the local Node.js server, with all devices on the same LAN.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Qurioso $RELEASE_TAG" \
            --notes-file release/notes.md \
            "${release_options[@]}" \
            "release/qurioso-web-${RELEASE_TAG}.zip" \
            "release/qurioso-android-debug-${RELEASE_TAG}.apk"
